<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Modifier le produit</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f7fafc; }
        header { background: #2563eb; color: white; padding: 1rem 2rem; }
        header h1 { font-size: 1.5rem; }
        nav { background: #1d4ed8; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #bfdbfe; text-decoration: none; font-size: 0.95rem; }
        nav a:hover { color: white; }
        main { max-width: 700px; margin: 2rem auto; padding: 1rem; }
        .card { background: white; padding: 1.2rem; border-radius: 8px; }
        label { font-weight: 600; color: #374151; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #e5e7eb; border-radius: 6px; }
        .btn { padding: 0.5rem 1rem; background: #2563eb; color: white; border-radius: 6px; border: none; cursor: pointer; }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
<header><h1>🍃 TP Spring Boot</h1></header>
<nav>
    <a href="/">🏠 Accueil</a>
    <a href="/products">📦 Produits</a>
    <a href="/articles">📝 Blog</a>
    <span style="margin-left:auto;">
        <a href="/logout">🚪 Déconnexion</a>
    </span>
</nav>
<main>
    <div class="card">
        <h2>✏️ Modifier le produit</h2>
        <form th:action="@{/products/{id}/update(id=${product.id})}" th:object="${product}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div>
                <label>Nom</label>
                <input type="text" th:field="*{name}" />
            </div>
            <div style="margin-top:0.5rem;">
                <label>Prix</label>
                <input type="number" step="0.01" th:field="*{price}" />
            </div>
            <div style="margin-top:0.5rem;">
                <label>Description</label>
                <input type="text" th:field="*{description}" />
            </div>
            <div style="margin-top:0.5rem;" th:if="${product.imageUrl != null}">
                <label>Photo actuelle</label>
                <img th:src="${product.imageUrl}" alt="Photo du produit" style="display:block;width:100%;max-height:220px;object-fit:cover;border-radius:8px;margin-top:0.5rem;">
            </div>
            <div style="margin-top:0.5rem;">
                <label>Changer la photo</label>
                <input type="file" name="imageFile" accept="image/png,image/jpeg,image/webp,image/gif" />
            </div>
            <div style="margin-top:1rem;display:flex;gap:0.5rem;">
                <button class="btn" type="submit">Enregistrer</button>
                <a th:href="@{/products}" class="btn" style="background:#6b7280">Annuler</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
