<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Commerçants - Administration</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f3f4f6; }
        header { background: #2563eb; color: white; padding: 1rem 2rem; }
        header h1 { font-size: 1.5rem; }
        nav { background: #1d4ed8; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #bfdbfe; text-decoration: none; font-size: 0.95rem; }
        nav a:hover { color: white; }
        main { max-width: 900px; margin: 2rem auto; padding: 1rem; }
        table { width: 100%; background: white; border-radius: 8px; overflow: hidden; }
        th { background: #eef2ff; color: #1e40af; padding: 0.75rem; }
        td { padding: 0.75rem; }
        .btn { padding: 0.4rem 0.8rem; background: #2563eb; color: white; border-radius: 6px; border: none; cursor: pointer; }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
<header><h1>🍃 TP Spring Boot</h1></header>
<nav>
    <a href="/">🏠 Accueil</a>
    <a href="/products">📦 Produits</a>
    <a href="/articles">📝 Blog</a>
    <span style="margin-left:auto;">
        <a href="/logout">🚪 Déconnexion</a>
    </span>
</nav>
<main>
    <h2>Administration — Commerçants</h2>
    <div th:if="${merchants}" >
        <table>
            <thead>
            <tr><th>ID</th><th>Nom</th><th>Email</th><th>Payé</th><th>Actif</th><th>Action</th></tr>
            </thead>
            <tbody>
            <tr th:each="m : ${merchants}">
                <td th:text="${m.id}"></td>
                <td th:text="${m.fullName}"></td>
                <td th:text="${m.email}"></td>
                <td th:text="${m.merchantPaid}"></td>
                <td th:text="${m.active}"></td>
                <td>
                    <form th:action="@{/admin/merchants/{id}/approve(id=${m.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                        <button class="btn" type="submit">Approuver</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
