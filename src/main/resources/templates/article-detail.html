<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title th:text="${article.title} + ' - Blog'">Article</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        header { background: #2563eb; color: white; padding: 1rem 2rem; }
        nav { background: #1d4ed8; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #bfdbfe; text-decoration: none; font-size: 0.95rem; }
        nav a:hover { color: white; }
        main { max-width: 800px; margin: 2rem auto; padding: 0 1rem; }
        .success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .article-full { background: white; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 2rem; }
        .article-full h2 { font-size: 1.75rem; color: #1d4ed8; margin-bottom: 1rem; }
        .article-full p { line-height: 1.7; color: #374151; }
        .back { display: inline-block; margin-bottom: 1rem; color: #2563eb; text-decoration: none; font-size: 0.9rem; }
        .back:hover { text-decoration: underline; }
        h3 { font-size: 1.2rem; color: #374151; margin-bottom: 1rem; }
        .comments-list { display: grid; gap: 0.75rem; margin-bottom: 2rem; }
        .comment-card { background: white; border-radius: 8px; padding: 1rem 1.25rem; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid #2563eb; }
        .comment-author { font-weight: bold; color: #2563eb; font-size: 0.9rem; margin-bottom: 0.3rem; }
        .comment-text { color: #374151; font-size: 0.95rem; }
        .no-comment { color: #9ca3af; text-align: center; padding: 1.5rem; background: white; border-radius: 8px; }
        .form-card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); }
        .form-card h3 { margin-bottom: 1rem; }
        .form-group { margin-bottom: 1rem; display: flex; flex-direction: column; gap: 0.25rem; }
        label { font-size: 0.85rem; font-weight: 600; color: #6b7280; }
        input, textarea { border: 1px solid #d1d5db; border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.95rem; width: 100%; }
        textarea { min-height: 80px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
        .error-msg { color: #dc2626; font-size: 0.78rem; }
        .btn { padding: 0.55rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; }
        .btn:hover { background: #1d4ed8; }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
<header><h1 style="font-size:1.5rem;color:white;">🍃 TP Spring Boot</h1></header>
<nav>
    <a href="/">🏠 Accueil</a>
    <a href="/products">📦 Produits</a>
    <a href="/articles">📝 Blog</a>
</nav>
<main>
    <a href="/articles" class="back">← Retour aux articles</a>

    <div class="success" th:if="${success}" th:text="${success}"></div>

    <!-- Article complet -->
    <div class="article-full">
        <h2 th:text="${article.title}"></h2>
        <p th:text="${article.content}"></p>
    </div>

    <!-- Commentaires -->
    <h3>💬 Commentaires (<span th:text="${#lists.size(article.comments)}">0</span>)</h3>

    <div class="comments-list">
        <div th:each="comment : ${article.comments}" class="comment-card">
            <div class="comment-author" th:text="${comment.author}"></div>
            <div class="comment-text" th:text="${comment.text}"></div>
            <div style="margin-top:0.75rem;"
                 th:if="${canManageAllComments or (authenticated and comment.ownerEmail != null and comment.ownerEmail == currentEmail)}">
                <form th:action="@{/articles/{articleId}/comments/{commentId}/update(articleId=${article.id},commentId=${comment.id})}" method="post" style="display:grid;gap:0.5rem;margin-bottom:0.5rem;">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <input type="text" name="author" th:value="${comment.author}" />
                    <textarea name="text" th:text="${comment.text}"></textarea>
                    <button type="submit" class="btn">Modifier</button>
                </form>
                <form th:action="@{/articles/{articleId}/comments/{commentId}/delete(articleId=${article.id},commentId=${comment.id})}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn" style="background:#dc2626;" onclick="return confirm('Supprimer ce commentaire ?')">Supprimer</button>
                </form>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(article.comments)}" class="no-comment">
            Aucun commentaire. Soyez le premier à réagir !
        </div>
    </div>

    <!-- Formulaire d'ajout de commentaire -->
    <div class="form-card">
        <h3>✍️ Laisser un commentaire</h3>
        <form th:action="@{/articles/{id}/comments(id=${article.id})}"
              th:object="${newComment}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label>Votre nom *</label>
                <input type="text" th:field="*{author}" placeholder="Jean Dupont"/>
                <span class="error-msg" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span>
            </div>
            <div class="form-group">
                <label>Commentaire *</label>
                <textarea th:field="*{text}" placeholder="Votre commentaire..."></textarea>
                <span class="error-msg" th:if="${#fields.hasErrors('text')}" th:errors="*{text}"></span>
            </div>
            <button type="submit" class="btn">Publier le commentaire</button>
        </form>
    </div>
</main>
</body>
</html>
