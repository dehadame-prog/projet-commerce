<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blog - TP Spring Boot</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; color: #333; }
        header { background: #2563eb; color: white; padding: 1rem 2rem; }
        header h1 { font-size: 1.5rem; }
        nav { background: #1d4ed8; padding: 0.5rem 2rem; display: flex; gap: 1.5rem; }
        nav a { color: #bfdbfe; text-decoration: none; font-size: 0.95rem; }
        nav a:hover { color: white; }
        main { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
        h2 { font-size: 1.5rem; margin-bottom: 1.5rem; color: #1d4ed8; }
        .success { background: #d1fae5; border: 1px solid #6ee7b7; color: #065f46; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1rem; }
        .form-card { background: white; padding: 1.5rem; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.08); margin-bottom: 2rem; }
        .form-card h3 { margin-bottom: 1rem; color: #374151; }
        .form-group { display: flex; flex-direction: column; gap: 0.25rem; margin-bottom: 1rem; }
        label { font-size: 0.85rem; font-weight: 600; color: #6b7280; }
        input, textarea { border: 1px solid #d1d5db; border-radius: 6px; padding: 0.5rem 0.75rem; font-size: 0.95rem; width: 100%; }
        textarea { min-height: 90px; resize: vertical; }
        input:focus, textarea:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px #dbeafe; }
        .error-msg { color: #dc2626; font-size: 0.78rem; }
        .btn { padding: 0.55rem 1.2rem; background: #2563eb; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 0.9rem; text-decoration: none; display: inline-block; }
        .btn:hover { background: #1d4ed8; }
        .btn-danger { background: #dc2626; font-size: 0.8rem; padding: 0.3rem 0.7rem; }
        .btn-danger:hover { background: #b91c1c; }
        .articles-grid { display: grid; gap: 1rem; }
        .article-card { background: white; border-radius: 10px; padding: 1.25rem 1.5rem; box-shadow: 0 2px 8px rgba(0,0,0,.08); display: flex; justify-content: space-between; align-items: center; }
        .article-info h4 { color: #1d4ed8; margin-bottom: 0.3rem; }
        .article-info p { color: #6b7280; font-size: 0.85rem; }
        .article-actions { display: flex; gap: 0.5rem; align-items: center; }
        .badge { background: #eff6ff; color: #2563eb; border-radius: 20px; padding: 0.2rem 0.6rem; font-size: 0.78rem; }
        .empty { text-align: center; padding: 2rem; color: #9ca3af; background: white; border-radius: 10px; }
    </style>
    <link rel="stylesheet" th:href="@{/css/theme.css}">
    <script th:src="@{/js/theme.js}" defer></script>
</head>
<body>
<header><h1>🍃 TP Spring Boot</h1></header>
<nav>
    <a href="/">🏠 Accueil</a>
    <a href="/products">📦 Produits</a>
    <a href="/articles">📝 Blog</a>
    <span style="margin-left:auto;">
        <a href="/login" th:if="${!authenticated}">🔐 Login</a>
        <a href="/logout" th:if="${authenticated}">🚪 Déconnexion</a>
    </span>
</nav>
<main>
    <h2>📝 Blog avec Commentaires</h2>

    <div class="success" th:if="${success}" th:text="${success}"></div>

    <!-- Formulaire d'ajout -->
    <div class="form-card" th:if="${canManageArticles}">
        <h3>✏️ Publier un article</h3>
        <form th:action="@{/articles}" th:object="${newArticle}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <div class="form-group">
                <label>Titre *</label>
                <input type="text" th:field="*{title}" placeholder="Titre de l'article"/>
                <span class="error-msg" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
            </div>
            <div class="form-group">
                <label>Contenu *</label>
                <textarea th:field="*{content}" placeholder="Rédigez votre article..."></textarea>
                <span class="error-msg" th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></span>
            </div>
            <button type="submit" class="btn">Publier</button>
        </form>
    </div>

    <!-- Liste des articles -->
    <div class="articles-grid">
        <div th:each="article : ${articles}" class="article-card">
            <div class="article-info">
                <h4 th:text="${article.title}"></h4>
                <p th:text="${#strings.abbreviate(article.content, 80)}"></p>
                <span class="badge" th:text="${#lists.size(article.comments)} + ' commentaire(s)'"></span>
            </div>
            <div class="article-actions">
                <a th:href="@{/articles/{id}(id=${article.id})}" class="btn">👁️ Lire</a>
                <form th:action="@{/articles/{id}/delete(id=${article.id})}" method="post" th:if="${canManageArticles}">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                    <button type="submit" class="btn btn-danger"
                            onclick="return confirm('Supprimer cet article ?')">🗑️</button>
                </form>
            </div>
        </div>
        <div th:if="${#lists.isEmpty(articles)}" class="empty">
            Aucun article publié. Soyez le premier à écrire !
        </div>
    </div>
</main>
</body>
</html>
