# ──────────────────────────────────────────
# Profil DEV → Base de données H2 en mémoire
# Lancement : -Dspring.profiles.active=dev
# ──────────────────────────────────────────
spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # Console H2 accessible via http://localhost:8080/h2-console
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop   # Recrée les tables à chaque démarrage
    defer-datasource-initialization: true

  # Données initiales (chargées au démarrage)
  sql:
    init:
      mode: always
