# Configuration de base (commune à tous les profils)
spring:
  application:
    name: tp-spring-boot

  # Active le profil dev par défaut
  profiles:
    active: dev

  # Configuration JPA commune
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

# Logging
logging:
  level:
    com.example.tp: DEBUG
    org.hibernate.SQL: DEBUG
